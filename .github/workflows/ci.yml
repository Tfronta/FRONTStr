name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontstr/**"
      - "tests/**"
      - "benchmark/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "frontstr/**"
      - "tests/**"
      - "benchmark/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

# NOTE: no `defaults.run.working-directory` here. The root of this repo IS the
# project root (pyproject.toml lives beside this file's .github/), and frontstr/
# is the Python package. Setting working-directory: frontstr puts every step
# inside the package directory, where `pip install ".[dev]"` fails with
# "Neither 'setup.py' nor 'pyproject.toml' found".

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      # benchmark/ and examples/ are not shipped, but they are the two places a
      # rename in frontstr/ breaks silently: benchmark/ decides whether a caller
      # change helped, and examples/ is the first thing a new user runs. Four of
      # the five demos had been calling a CLI option that no longer existed.
      - name: Ruff
        run: ruff check frontstr tests benchmark examples
      - name: Ruff format check
        run: ruff format --check frontstr tests benchmark
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev
      # The poa extra is not optional for a meaningful test run: without a POA
      # backend the consensus silently degrades to a single unpolished read, so
      # the suite would exercise the fallback and never the real path. It is
      # also what `doctor` checks for, and it exits non-zero when it is missing.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,poa]"
      - name: Test
        run: pytest --cov=frontstr --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
