name: CI

on:
  push:
    branches: [main, develop]
    paths: ["frontstr/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["frontstr/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: frontstr

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff
        run: ruff check frontstr tests
      - name: Ruff format check
        run: ruff format --check frontstr tests
      - name: Mypy
        run: mypy frontstr

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test
        run: pytest --cov=frontstr --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontstr/coverage.xml
