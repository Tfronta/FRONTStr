    category: autosomal

  - name: D21S11
    chromosome: chr21
    ref_start: 19181872
    ref_end: 19182199
    motif: TCTA,TCTG
    period: -1
    corr_value: 3  # 1 left-flank TCTG + 2 right-flank TCTG from GRCh38 reference
    category: autosomal
    allow_triallelic: true
    kit_nomenclature_note: >-
      D21S11 uses the Gill et al. 1994 convention, in which the total
      TCTA+TCTG unit count is not the allele number: the structural elements
      (ta, tca, tccata, tcg, tccag) produce a bracket count that does not map
      1:1 onto the kit designation. Observed offset on HG00113 is +4 per
      allele (bracket 35/33 vs kit 29/31).

