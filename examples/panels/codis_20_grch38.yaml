# FRONTStr panel: CODIS 20 core forensic loci on GRCh38.
#
# Allele numbers on compound markers (motif lists, period: -1) need a panel
# field ``reference_ce``: the kit/str allele associated with the genome REF in
# this interval — see STRBase / your ladder calibration. Δbp vs the REF-window
# length is then scaled by ``allele_bp_step`` (default 4) and added for each
# called consensus (LongTR-style). Simple tetramers continue to use ``period``.
#
# Coordinates and motifs follow the consensus from the STRBase project and
# the published forensic literature.
#
# corr_value interpretation depends on period:
#   period > 0 : flanking bp (non-repeat) in the window.
#                CE = (extracted_length_bp - corr_value) / period
#   period = -1: flanking motif units in the window (units outside the core
#                repeat block). CE = ce_from_brackets(isfg) - corr_value.
#                Calibrated from GRCh38 reference FASTA: core block identified
#                as the maximal group of motif tokens separated by ≤12 non-motif
#                chars (legitimate spacers: ta/tca/tccata/tcg/tccag are ≤6 bp).
#                Exception: D19S433 uses corr_value=1 because the reference has
#                a pre-repeat AAGG immediately before a 4-bp imperfect spacer
#                (aaag), which marks the boundary of the structured repeat array.
#
# Coordinate expansion (2026-05): windows widened to LongTR repeat
# boundaries ± 100 bp flanking on each side. This ensures longer alleles
# are never truncated on ONT long reads.
#
# strand = "-" for markers whose published ISFG motif reads on the minus
# strand; the consensus is RC'd before bracket compression (P2).
#
# WARNING: Triallelic propensity flags are set conservatively. Adjust per
# laboratory experience. See plan-longtr-improved.md §6.4.

name: CODIS 20 + sex
version: 2026.06-ont-wide-sex
reference_build: GRCh38
description: |
  Core CODIS 20 autosomal markers + Amelogenin + sex-validation STRs
  (DYS391, DYS393 on chrY; DXS7132, DXS8378 on chrX). ONT R10-friendly
  defaults. Windows cover LongTR repeat boundaries ± 100 bp for long-read
  safety. corr_values calibrated against GRCh38 reference (May 2026 for
  CODIS 20, June 2026 for the four sex STRs).

systems:
  - name: D3S1358
    chromosome: chr3
    ref_start: 45540634
    ref_end: 45540907
    motif: TCTA,TCTG
    period: -1
    corr_value: 4  # 3 left-flank + 1 right-flank TCTG/TCTA from GRCh38 reference
    category: autosomal

  - name: vWA
    chromosome: chr12
    ref_start: 5983877
    ref_end: 5984149
    motif: TCTA,TCTG
    period: -1
    corr_value: 8  # 1 left-flank + 7 right-flank TCTA/TCTG from GRCh38 reference
    strand: "-"
    category: autosomal
    kit_nomenclature_note: >-
      Bracket count and kit designation differ by +1 and -1 in OPPOSITE
      directions for the two common alleles, so no single corr_value can
      reconcile them: allele 16's core includes a post-tcca TCTA unit the
      convention does not count, while allele 14's microvariant structure
      (TCTA TCTG TCTA [TCTG]4 [TCTA]3 tcca [TCTA]3) the convention counts as
      14 and bracket counting gives 13. The ISFG string is structurally
      correct either way; only the number differs.

  - name: FGA
    chromosome: chr4
    ref_start: 154587635
    ref_end: 154587923
    motif: CTTT,TTCC,CTCC
    period: -1
    corr_value: 0
    strand: "-"
    category: autosomal
    allow_triallelic: true

  - name: D8S1179
    chromosome: chr8
    ref_start: 124894765
    ref_end: 124895016
    motif: TCTA,TCTG
    period: -1
