# FRONTStr panel: CODIS 20 core forensic loci on GRCh38.
#
# Coordinates and motifs follow the consensus from the STRBase project and
# the published forensic literature.
#
# corr_value = number of non-repeat flanking bases within the extraction
# window. Used by ce_from_length (period > 0) so that CE equals the
# repeat-unit count. Calibrated against GRCh38_no_alt_analysis_set.fna,
# May 2026. Period = -1 markers use ce_from_brackets and ignore corr_value.
#
# strand = "-" for markers whose published ISFG motif reads on the minus
# strand; the consensus is RC'd before bracket compression (P2).
#
# WARNING: Triallelic propensity flags are set conservatively. Adjust per
# laboratory experience. See plan-longtr-improved.md §6.4.

name: CODIS 20
version: 2026.05-calibrated
reference_build: GRCh38
description: |
  Core CODIS 20 autosomal markers + Amelogenin. ONT R10-friendly defaults.
  corr_values calibrated against GRCh38 reference, May 2026.

