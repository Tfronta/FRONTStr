[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "frontstr"
description = "Forensic Ranked Output for Nanopore Tandem Short Tandem Repeats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]
authors = [
    { name = "FRONTStr contributors" },
]
keywords = ["forensic", "str", "nanopore", "ont", "longtr", "isfg", "tandem-repeat"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pysam>=0.22.0",
    "cyvcf2>=0.31.0",
    "edlib>=1.3.9",
    "pyyaml>=6.0",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "lxml>=5.2.0",
    "openpyxl>=3.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# A POA backend is REQUIRED for forensic-grade consensus; without one the
# cluster consensus degrades to a single unpolished read (see
# frontstr/evidence/consensus.py). pyabpoa is preferred but does not build on
# macOS arm64 (hardcoded AVX2 intrinsics); pyspoa builds on both arches.
parquet = ["pyarrow>=16.0"]
poa = ["pyspoa>=0.3.2"]
poa-abpoa = ["pyabpoa>=1.5.0"]
pdf = ["weasyprint>=62.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-lxml",
    "types-openpyxl",
    "hypothesis>=6.100",
    "pyarrow>=16.0",
]

[project.scripts]
frontstr = "frontstr.cli:app"

[project.urls]
Documentation = "https://github.com/TBD/frontstr"
Source = "https://github.com/TBD/frontstr"
Issues = "https://github.com/TBD/frontstr/issues"

[tool.hatch.version]
path = "frontstr/version.py"

[tool.hatch.build.targets.wheel]
packages = ["frontstr"]

[tool.hatch.build.targets.wheel.force-include]
"frontstr/report/templates" = "frontstr/report/templates"
"frontstr/report/static" = "frontstr/report/static"

[tool.hatch.build.targets.sdist]
include = ["frontstr", "examples", "tests", "README.md", "ROADMAP.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "C4",                # flake8-comprehensions
    "SIM",               # flake8-simplify
    "RUF",               # ruff-specific
]
ignore = ["E501"]
# This is a scientific codebase: "±100 bp", "12 × 4", "period −1" and "≥ 5 reads"
# are the notation the domain actually uses. Mangling them to ASCII makes the
# comments harder to read than the confusable characters ever made them.
allowed-confusables = ["×", "–", "−", "±", "≥", "≤", "→"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["frontstr"]

[[tool.mypy.overrides]]
module = ["pysam.*", "cyvcf2.*", "edlib.*", "pyabpoa.*", "spoa.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -q"
testpaths = ["tests"]
markers = [
    "integration: requires external binaries (minimap2, LongTR, samtools)",
    "slow: tests that take more than 5 seconds",
]
